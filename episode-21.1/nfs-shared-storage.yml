apiVersion: v1
kind: PersistentVolume
metadata:
  name: nfs-shared-pv
spec:
  storageClassName: nfs
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  nfs:
    server: 10.0.0.50
    path: /exports/shared
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nfs-shared-pvc
  namespace: production
spec:
  storageClassName: nfs
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 50Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: file-upload-service
  namespace: production
spec:
  replicas: 3
  selector:
    matchLabels:
      app: file-upload
  template:
    metadata:
      labels:
        app: file-upload
    spec:
      containers:
        - name: app
          image: myapp:latest
          volumeMounts:
            - name: shared-uploads
              mountPath: /var/uploads
      volumes:
        - name: shared-uploads
          persistentVolumeClaim:
            claimName: nfs-shared-pvc
