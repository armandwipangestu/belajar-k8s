apiVersion: v1
kind: Pod
metadata:
  name: mixed-env-pod
spec:
  containers:
    - name: app
      image: myapp:latest
      env:
        # Direct value
        - name: ENVIRONMENT
          value: "production"
        # From ConfigMap
        - name: DATABASE_HOST
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: database.host
        # From Secret
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: password
        # From Downward API
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
      # Import all from ConfigMap
      envFrom:
        - configMapRef:
            name: app-config
          prefix: CONFIG_
        # Import all from Secret
        - secretRef:
            name: app-secrets
          prefix: SECRET_
