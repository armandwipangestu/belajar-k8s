apiVersion: v1
kind: Pod
metadata:
  name: multi-init-pod
spec:
  initContainers:
    # First init container
    - name: download-config
      image: curlimages/curl:latest
      command:
        - sh
        - -c
        - curl -o /config/app.conf https://config-server/app.conf
      volumeMounts:
        - name: config
          mountPath: /config
    # Second init container (run setelah first complete)
    - name: validate-config
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          if [ -f /config/app.conf ]; then
            echo "Config valid"
          else
            echo "Config missing" && exit 1
          fi
      volumeMounts:
        - name: config
          mountPath: /config
  containers:
    - name: application
      image: myapp:latest
      volumeMounts:
        - name: config
          mountPath: /etc/app
  volumes:
    - name: config
      emptyDir: {}
