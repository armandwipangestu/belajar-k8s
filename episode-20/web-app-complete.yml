apiVersion: v1
kind: Pod
metadata:
  name: web-app-complete
  labels:
    app: web
spec:
  containers:
    # Main web application
    - name: nginx
      image: nginx:1.25
      ports:
        - containerPort: 80
      volumeMounts:
        - name: logs
          mountPath: /var/log/nginx
        - name: html
          mountPath: /usr/share/nginx/html
      resources:
        requests:
          memory: "128Mi"
          cpu: "100m"
        limits:
          memory: "256Mi"
          cpu: "200m"
    # Log shipping sidecar
    - name: log-shipper
      image: fluent/fluentd:v1.16
      volumeMounts:
        - name: logs
          mountPath: /var/log/nginx
      resources:
        requests:
          memory: "64Mi"
          cpu: "50m"
        limits:
          memory: "128Mi"
          cpu: "100m"
    # Metrics exporter sidecar
    - name: nginx-exporter
      image: nginx/nginx-prometheus-exporter:latest
      ports:
        - containerPort: 9113
      args:
        - -nginx.scrape-uri=http://localhost:80/stub_status
      resources:
        requests:
          memory: "32Mi"
          cpu: "25m"
        limits:
          memory: "64Mi"
          cpu: "50m"
  volumes:
    - name: logs
      emptyDir: {}
    - name: html
      emptyDir: {}
