apiVersion: v1
kind: Pod
metadata:
  name: pod-with-init
spec:
  initContainers:
    - name: init-setup
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          echo "Initializing..."
          sleep 5
          echo "Setup complete" > /work-dir/ready.txt
      volumeMounts:
        - name: workdir
          mountPath: /work-dir
  containers:
    - name: main-app
      image: nginx:1.25
      volumeMounts:
        - name: workdir
          mountPath: /work-dir
  volumes:
    - name: workdir
      emptyDir: {}
