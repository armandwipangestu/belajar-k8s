apiVersion: v1
kind: Pod
metadata:
  name: lifecycle-pod
spec:
  containers:
    - name: main-app
      image: nginx:1.25
      lifecycle:
        postStart:
          exec:
            command:
              - sh
              - -c
              - echo "Container started" > /usr/share/message
        preStop:
          exec:
            command:
              - sh
              - -c
              - nginx -s quit; sleep 10
    - name: sidecar
      image: busybox:1.36
      command:
        - sh
        - -c
        - while true; do sleep 3600; done
