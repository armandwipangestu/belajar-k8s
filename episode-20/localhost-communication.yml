apiVersion: v1
kind: Pod
metadata:
  name: multi-container-pod
spec:
  containers:
    - name: web-app
      image: nginx
      ports:
        - containerPort: 80
    - name: log-agent
      image: busybox
      command:
        - sh
        - -c
        - "while true; do wget -q -O- http://localhost:80; sleep 5; done"
