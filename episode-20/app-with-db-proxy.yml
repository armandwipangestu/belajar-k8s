apiVersion: v1
kind: Pod
metadata:
  name: app-with-db-proxy
spec:
  containers:
    # Main application
    - name: application
      image: myapp:latest
      env:
        - name: DB_HOST
          value: "127.0.0.1"
        - name: DB_PORT
          value: "5432"
      ports:
        - containerPort: 8080
    # Cloud SQL Proxy sidecar
    - name: cloud-sql-proxy
      image: gcr.io/cloudsql-docker/gce-proxy:latest
      command:
        - /cloud_sql_proxy
        - -instances=project:region:instance=tcp:5432
      securityContext:
        runAsNonRoot: true
