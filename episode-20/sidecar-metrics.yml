apiVersion: v1
kind: Pod
metadata:
  name: app-with-metrics
spec:
  containers:
    # Main application
    - name: application
      image: myapp:latest
      ports:
        - containerPort: 8080
    # Metrics exporter sidecar
    - name: metrics-exporter
      image: prom/nginx-exporter:latest
      ports:
        - containerPort: 9113
      args:
        - -nginx.scrape-uri=http://localhost:8080/metrics
