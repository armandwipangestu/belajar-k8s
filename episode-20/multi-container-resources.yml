apiVersion: v1
kind: Pod
metadata:
  name: resource-managed-pod
spec:
  containers:
    - name: main-app
      image: myapp:latest
      resources:
        requests:
          memory: "512Mi"
          cpu: "500m"
        limits:
          memory: "1Gi"
          cpu: "1000m"
    - name: sidecar
      image: sidecar:latest
      resources:
        requests:
          memory: "128Mi"
          cpu: "100m"
        limits:
          memory: "256Mi"
          cpu: "200m"
