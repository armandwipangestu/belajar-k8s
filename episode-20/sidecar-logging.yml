apiVersion: v1
kind: Pod
metadata:
  name: web-with-logging
spec:
  containers:
    # Main application container
    - name: web-app
      image: nginx:1.25
      ports:
        - containerPort: 80
      volumeMounts:
        - name: logs
          mountPath: /var/log/nginx
    # Sidecar container untuk log shipping
    - name: log-shipper
      image: fluent/fluentd:v1.16
      volumeMounts:
        - name: logs
          mountPath: /var/log/nginx
      env:
        - name: FLUENTD_CONF
          value: fluent.conf
  volumes:
    - name: logs
      emptyDir: {}
