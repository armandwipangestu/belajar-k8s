apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app
  namespace: production
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-app
  template:
    metadata:
      labels:
        app: web-app
    spec:
      containers:
        - name: app
          image: myapp:latest
          ports:
            - containerPort: 8080
          env:
            # Konfigurasi non-sensitif dari ConfigMap
            - name: APP_ENV
              value: production
            - name: LOG_LEVEL
              value: info
          # Konfigurasi sensitif dari Secret
          envFrom:
            - secretRef:
                name: postgres-credentials
          volumeMounts:
            - name: tls-certs
              mountPath: /etc/ssl/app
              readOnly: true
      volumes:
        - name: tls-certs
          secret:
            secretName: tls-secret
            defaultMode: 0400
