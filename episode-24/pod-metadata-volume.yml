apiVersion: v1
kind: Pod
metadata:
  name: downward-volume-pod
  namespace: default
  labels:
    app: myapp
    version: v1.0
  annotations:
    description: "Example application"
    owner: "platform-team"
spec:
  containers:
    - name: app
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          echo "=== Pod Metadata ==="
          cat /etc/podinfo/name
          cat /etc/podinfo/namespace
          cat /etc/podinfo/labels
          cat /etc/podinfo/annotations
          sleep 3600
      volumeMounts:
        - name: podinfo
          mountPath: /etc/podinfo
  volumes:
    - name: podinfo
      downwardAPI:
        items:
          - path: "name"
            fieldRef:
              fieldPath: metadata.name
          - path: "namespace"
            fieldRef:
              fieldPath: metadata.namespace
          - path: "labels"
            fieldRef:
              fieldPath: metadata.labels
          - path: "annotations"
            fieldRef:
              fieldPath: metadata.annotations
