apiVersion: v1
kind: Pod
metadata:
  name: multi-container-pod
  labels:
    app: myapp
    version: v1.0
spec:
  containers:
    # Main application
    - name: app
      image: myapp:latest
      env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
      volumeMounts:
        - name: podinfo
          mountPath: /etc/podinfo
    # Sidecar for monitoring
    - name: monitor
      image: monitor:latest
      env:
        - name: MONITORED_POD
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: MONITORED_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
      volumeMounts:
        - name: podinfo
          mountPath: /etc/podinfo
          readOnly: true
  volumes:
    - name: podinfo
      downwardAPI:
        items:
          - path: "labels"
            fieldRef:
              fieldPath: metadata.labels
          - path: "annotations"
            fieldRef:
              fieldPath: metadata.annotations
