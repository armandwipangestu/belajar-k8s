apiVersion: batch/v1
kind: CronJob
metadata:
  name: replace-cronjob
spec:
  schedule: "*/1 * * * *"
  concurrencyPolicy: Replace
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: task
              image: busybox
              args:
                - /bin/sh
                - -c
                - echo "Starting"; sleep 120; echo "Done"
          restartPolicy: Never
