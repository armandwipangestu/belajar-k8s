apiVersion: v1
kind: Pod
metadata:
  name: init-volume-pod
spec:
  initContainers:
    - name: setup
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          echo "Downloading configuration..."
          wget -O /config/app.conf https://config-server/app.conf
          echo "Setup complete"
      volumeMounts:
        - name: config
          mountPath: /config
  containers:
    - name: app
      image: myapp:latest
      volumeMounts:
        - name: config
          mountPath: /etc/app
  volumes:
    - name: config
      emptyDir: {}
