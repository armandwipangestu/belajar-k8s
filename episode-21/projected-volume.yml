apiVersion: v1
kind: Pod
metadata:
  name: projected-pod
spec:
  containers:
    - name: app
      image: nginx:1.25
      volumeMounts:
        - name: all-config
          mountPath: /etc/config
  volumes:
    - name: all-config
      projected:
        sources:
          - configMap:
              name: app-config
          - secret:
              name: db-credentials
          - downwardAPI:
              items:
                - path: pod-name
                  fieldRef:
                    fieldPath: metadata.name
