apiVersion: v1
kind: Pod
metadata:
  name: ml-training
spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: accelerator
                operator: In
                values:
                  - nvidia-gpu
              - key: gpu-memory
                operator: Gt
                values:
                  - "8Gi"
  containers:
    - name: training
      image: ml-training:latest
      resources:
        requests:
          nvidia.com/gpu: 1
