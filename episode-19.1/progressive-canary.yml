# Phase 1: 5% canary
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: app-route
spec:
  parentRefs:
    - name: example-gateway
  rules:
    - backendRefs:
        - name: stable-service
          port: 80
          weight: 95
        - name: canary-service
          port: 80
          weight: 5
