apiVersion: batch/v1
kind: Job
metadata:
  name: work-queue-job
spec:
  parallelism: 3
  template:
    spec:
      containers:
        - name: worker
          image: busybox
          command:
            - /bin/sh
            - -c
            - echo "Processing work item"; sleep 5; echo "Done"
      restartPolicy: Never
