apiVersion: v1
kind: LimitRange
metadata:
  name: resource-limits
  namespace: development
spec:
  limits:
    # Container limit
    - type: Container
      default:
        memory: "512Mi" # Default limit
        cpu: "500m"
      defaultRequest:
        memory: "256Mi" # Default request
        cpu: "250m"
      max:
        memory: "2Gi" # Maximum limit
        cpu: "2000m"
      min:
        memory: "64Mi" # Minimum request
        cpu: "50m"
    # Pod limit
    - type: Pod
      max:
        memory: "4Gi"
        cpu: "4000m"
